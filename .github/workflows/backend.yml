name: Backend

# Always triggers on PRs to main; the `changes` job decides which per-concern
# jobs actually run. The REQUIRED check is the roll-up `backend` job at the
# bottom — it always reports a status (green when apps/backend + packages/shared
# are untouched), so requiring it never wedges a PR that doesn't touch the
# backend, while a real failure still blocks. Do not mark the granular jobs
# (format/lint/typecheck/…) required: they don't run on unrelated PRs and a job
# that never runs never reports.
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detects whether backend-relevant paths changed. The backend `implements` the
  # shared DTO interfaces, so a contract change can break it without any backend
  # file being touched — hence packages/shared/** is included.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'apps/backend/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.prettierrc'
              - '.github/actions/setup/**'
              - '.github/workflows/backend.yml'

  format:
    name: format
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Prettier
        run: npm run format:check:backend

  lint:
    name: lint
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: ESLint
        run: npm run lint -w @nonce/backend

  typecheck:
    name: typecheck
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: npm run typecheck -w @nonce/backend

  test:
    name: test
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Jest
        run: npm run test -w @nonce/backend

  build:
    name: build
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Nest build
        run: npm run build -w @nonce/backend
      # The Dockerfile ENTRYPOINT depends on this exact path. tsconfig sets outDir
      # without rootDir, so TypeScript nests output under dist/src — asserting it
      # here means a tsconfig change can't silently break the container.
      - name: Assert compiled entrypoint path
        run: test -f apps/backend/dist/src/main.js

  migrations:
    name: migrations
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: bitshala
    env:
      DB_POSTGRES_HOST: 'localhost'
      DB_POSTGRES_PORT: '5432'
      DB_POSTGRES_USERNAME: 'root'
      DB_POSTGRES_PASSWORD: 'password'
      DB_POSTGRES_DATABASE_NAME: 'bitshala'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run migrations
        run: npm run migration:run -w @nonce/backend
      # Ported from the old actions-check-migration.yml: if generating a migration
      # against an already-migrated database produces a new file, an entity change
      # landed without its migration.
      - name: Check for missing migrations
        run: |
          COUNT_AFTER_RUN=$(ls apps/backend/migrations | wc -l) && \
          (npm run migration:generate -w @nonce/backend || :) && \
          COUNT_AFTER_GENERATION=$(ls apps/backend/migrations | wc -l)
          if (( $COUNT_AFTER_RUN < $COUNT_AFTER_GENERATION )); then echo "Migration required but no migration was found."; exit 1; else exit 0; fi

  # Required roll-up check. `if: always()` so it runs (and reports the `backend`
  # status) even when the jobs above were skipped or failed. Passes when every
  # dependency succeeded or was skipped; fails if any failed or was cancelled.
  backend:
    name: backend
    needs: [changes, format, lint, typecheck, test, build, migrations]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any backend check failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A required backend check failed or was cancelled: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: Report
        run: |
          echo "backend checks OK (results: ${{ join(needs.*.result, ', ') }})"
