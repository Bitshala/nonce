name: Backend

# Triggers on packages/shared/** as well as apps/backend/**: the backend
# `implements` the shared DTO interfaces, so a contract change can break it
# without any backend file being touched.
on:
  push:
    branches: ['main']
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.prettierrc'
      - '.github/actions/setup/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.prettierrc'
      - '.github/actions/setup/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Prettier
        run: npm run format:check:backend

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: ESLint
        run: npm run lint -w @nonce/backend

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: npm run typecheck -w @nonce/backend

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Jest
        run: npm run test -w @nonce/backend

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Nest build
        run: npm run build -w @nonce/backend
      # The Dockerfile ENTRYPOINT depends on this exact path. tsconfig sets outDir
      # without rootDir, so TypeScript nests output under dist/src — asserting it
      # here means a tsconfig change can't silently break the container.
      - name: Assert compiled entrypoint path
        run: test -f apps/backend/dist/src/main.js

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: bitshala
    env:
      DB_POSTGRES_HOST: 'localhost'
      DB_POSTGRES_PORT: '5432'
      DB_POSTGRES_USERNAME: 'root'
      DB_POSTGRES_PASSWORD: 'password'
      DB_POSTGRES_DATABASE_NAME: 'bitshala'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run migrations
        run: npm run migration:run -w @nonce/backend
      # Ported from the old actions-check-migration.yml: if generating a migration
      # against an already-migrated database produces a new file, an entity change
      # landed without its migration.
      - name: Check for missing migrations
        run: |
          COUNT_AFTER_RUN=$(ls apps/backend/migrations | wc -l) && \
          (npm run migration:generate -w @nonce/backend || :) && \
          COUNT_AFTER_GENERATION=$(ls apps/backend/migrations | wc -l)
          if (( $COUNT_AFTER_RUN < $COUNT_AFTER_GENERATION )); then echo "Migration required but no migration was found."; exit 1; else exit 0; fi
